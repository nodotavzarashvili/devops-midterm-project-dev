name: DevOps Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q app.py calculator.py scripts

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run unit and API tests
        run: python -m pytest -v

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python for monitoring
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure deployment secrets are configured
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || (echo 'Missing VERCEL_TOKEN secret' && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo 'Missing VERCEL_ORG_ID secret' && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo 'Missing VERCEL_PROJECT_ID secret' && exit 1)
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Check uv version
        run: uv --version
      - name: Build Vercel deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel production
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed URL: $url"
      - name: Health check and log
        run: python scripts/health_check.py "$DEPLOY_URL/health" --retries 12 --delay 5
      - name: Upload health check .log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-log
          path: logs/health_check.log
          if-no-files-found: warn
